<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260" preserveAspectRatio="xMidYMid slice" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c1515"/>
    </marker>
  </defs>

  <!-- background fills the whole tile -->
  <rect x="0" y="0" width="320" height="260" fill="#ffffff"/>

  <!-- clockwise loop arrows (top->right->bottom->left->top) -->
  <g fill="none" stroke="#8c1515" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M 203.1 48.8 A 92 92 0 0 1 241.2 86.9"/>
    <path d="M 241.2 173.1 A 92 92 0 0 1 203.1 211.2"/>
    <path d="M 116.9 211.2 A 92 92 0 0 1 78.8 173.1"/>
    <path d="M 78.8 86.9 A 92 92 0 0 1 116.9 48.8"/>
  </g>

  <!-- center label -->
  <text x="160" y="125" text-anchor="middle" font-size="10" font-style="italic" font-weight="600" fill="#8c1515">self-reinforcing</text>
  <text x="160" y="137" text-anchor="middle" font-size="10" font-style="italic" font-weight="600" fill="#8c1515">collapse</text>

  <!-- nodes -->
  <!-- 1 top -->
  <g>
    <rect x="110" y="29" width="100" height="38" rx="13" fill="#ffffff" stroke="#8c1515" stroke-width="1.6"/>
    <text x="160" y="53" text-anchor="middle" font-size="13.5" font-weight="700" fill="#211f1b">low entropy</text>
    <circle cx="110" cy="29" r="9.5" fill="#8c1515"/>
    <text x="110" y="33" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
  </g>
  <!-- 2 right -->
  <g>
    <rect x="202" y="111" width="100" height="38" rx="13" fill="#ffffff" stroke="#8c1515" stroke-width="1.6"/>
    <text x="252" y="127" text-anchor="middle" font-size="12.5" font-weight="700" fill="#211f1b">identical</text>
    <text x="252" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#211f1b">rollouts</text>
    <circle cx="202" cy="111" r="9.5" fill="#8c1515"/>
    <text x="202" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
  </g>
  <!-- 3 bottom -->
  <g>
    <rect x="110" y="193" width="100" height="38" rx="13" fill="#ffffff" stroke="#8c1515" stroke-width="1.6"/>
    <text x="160" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#211f1b">reward var &#8594; 0</text>
    <circle cx="110" cy="193" r="9.5" fill="#8c1515"/>
    <text x="110" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
  </g>
  <!-- 4 left -->
  <g>
    <rect x="18" y="111" width="100" height="38" rx="13" fill="#ffffff" stroke="#8c1515" stroke-width="1.6"/>
    <text x="68" y="135" text-anchor="middle" font-size="13.5" font-weight="700" fill="#211f1b">gradient &#8776; 0</text>
    <circle cx="18" cy="111" r="9.5" fill="#8c1515"/>
    <text x="18" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
  </g>
</svg>
